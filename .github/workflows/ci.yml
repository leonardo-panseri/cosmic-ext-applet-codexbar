name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Format, clippy and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # libxkbcommon is the only system library the binary links; libwayland is dlopened.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      # Same lints as `just check`, with warnings denied.
      - name: cargo clippy
        run: cargo clippy --locked --all-features --all-targets -- -W clippy::pedantic -D warnings

      - name: cargo test
        run: cargo test --locked

  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The image has the freedesktop 25.08 SDK; flatpak-builder installs the rust-stable
    # extension and com.system76.Cosmic.BaseApp//stable from Flathub.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The manifest builds the checkout itself (a `dir` source), offline from
      # flatpak/cargo-sources.json. Build output stays in the folders the manifest skips.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/io.github.leonardo_panseri.cosmic-ext-applet-codexbar.json
          bundle: cosmic-ext-applet-codexbar.flatpak
          build-dir: build-flatpak/app
          repo-dir: build-flatpak/repo
          state-dir: .flatpak-builder
          cache-key: flatpak-builder-${{ hashFiles('flatpak/cargo-sources.json') }}
