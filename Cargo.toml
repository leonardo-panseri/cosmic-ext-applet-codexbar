[package]
name = "cosmic-ext-applet-codexbar"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "CodexBar applet for the COSMIC™ desktop"
repository = "https://github.com/leonardo-panseri/cosmic-ext-applet-codexbar.git"

[build-dependencies]
xdgen = "0.1"

[dependencies]
i18n-embed-fl = "0.10"
rust-embed = "8.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52.0", features = ["rt", "net", "time", "io-util", "macros"] }

[dev-dependencies]
tempfile = "3"

[dependencies.i18n-embed]
version = "0.16"
features = ["fluent-system", "desktop-requester"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
# The same set as pop-os/cosmic-applets. No `wgpu`: tiny-skia uses half the memory (ADR 0001,
# P0 item 7). No `x11`: the panel is Wayland-only. No `a11y`: libcosmic routes an accessibility
# click only to `on_press`, never to the `on_press_down` the panel button uses.
default-features = false
features = [
    # Applet support
    "applet",
    "applet-token",
    # Uses cosmic-settings-daemon to watch for config file changes
    "dbus-config",
    # Support creating additional application windows.
    "multi-window",
    # Uses tokio as the executor for the runtime
    "tokio",
    # Add Wayland support to winit
    "wayland",
    # Windowing support
    "winit",
]

# Uncomment to test a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }
